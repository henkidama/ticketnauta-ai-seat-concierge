# Alternative to token mode for a locally managed Cloudflare Tunnel.
# Do not commit the real tunnel ID or credentials JSON.
tunnel: REPLACE_WITH_TUNNEL_ID
credentials-file: /etc/cloudflared/REPLACE_WITH_TUNNEL_ID.json

ingress:
  - hostname: webmcp.example.com
    service: http://app:8080
  - service: http_status:404
